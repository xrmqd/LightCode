# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: LightCode macOS builds and releases

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (leave empty to build the selected branch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lightcode-macos-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "3"
  CARGO_NET_RETRY: "5"
  RUST_BACKTRACE: "1"
  LIGHTCODE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

jobs:
  build:
    name: macOS (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      TARGET: aarch64-apple-darwin
      ARCH: aarch64
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      commit: ${{ steps.meta.outputs.commit }}
      package: ${{ steps.meta.outputs.package }}
      profile: ${{ steps.meta.outputs.profile }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select build profile and release
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: ./script/ci-release-metadata

      - name: Prepare Xcode and build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            brew install cmake
          fi
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install the repository's Rust toolchain
        run: |
          set -euo pipefail
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$cargo_bin:$PATH"
          printf '%s\n' "$cargo_bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          rustup show active-toolchain
          rustup target add "$TARGET"

      - name: Build and package the application
        # Ad-hoc signing needs no Apple account or repository secrets.
        env:
          APPLE_SIGNING_KEY: "-"
        run: |
          set -euo pipefail
          if [[ "$BUILD_PROFILE" == debug ]]; then
            ./script/bundle-mac -d "$TARGET"
            ditto -c -k --sequesterRsrc --keepParent \
              "target/$TARGET/debug/bundle/osx/LightCode Dev.app" \
              "target/$TARGET/debug/$INSTALLER_NAME"
          else
            ./script/bundle-mac "$TARGET"
          fi

      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/$BUILD_PROFILE/$INSTALLER_NAME" dist/
          cp "target/lightcode-remote-server-macos-$ARCH.gz" dist/
          test -s "dist/$INSTALLER_NAME"
          test -s "dist/lightcode-remote-server-macos-$ARCH.gz"

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      INSTALLER_NAME: ${{ needs.build.outputs.package }}
    steps:
      - name: Check out the matching source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the Apple Silicon build
        uses: actions/download-artifact@v8
        with:
          name: macos-aarch64
          path: dist

      - name: Package matching source and checksums
        run: |
          set -euo pipefail
          test -s "dist/$INSTALLER_NAME"
          test -s dist/lightcode-remote-server-macos-aarch64.gz
          mkdir -p release-assets
          cp "dist/$INSTALLER_NAME" dist/lightcode-remote-server-macos-aarch64.gz release-assets/
          git archive --format=tar.gz --prefix=lightcode-source/ HEAD > release-assets/LightCode-source.tar.gz
          cd release-assets
          sha256sum -- "$INSTALLER_NAME" lightcode-remote-server-macos-aarch64.gz LightCode-source.tar.gz > SHA256SUMS.txt

      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_TITLE: ${{ needs.build.outputs.title }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          BUILD_PROFILE: ${{ needs.build.outputs.profile }}
        run: |
          set -euo pipefail
          latest=true
          if [[ "$PRERELEASE" == true ]]; then
            latest=false
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          LightCode for Apple Silicon. Rust profile: \`$BUILD_PROFILE\`.

          - \`$INSTALLER_NAME\`: the application.
          - \`lightcode-remote-server-macos-aarch64.gz\`: matching macOS SSH remote server.
          - \`LightCode-source.tar.gz\`: source for commit \`$RELEASE_COMMIT\`, including build scripts.
          - \`SHA256SUMS.txt\`: SHA-256 checksums.

          Builds are ad-hoc signed, without Apple Developer ID signing or notarization.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease="$PRERELEASE" --latest="$latest"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$RELEASE_COMMIT" --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease="$PRERELEASE" --latest="$latest"
          fi
